name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Cargo.toml version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo_version=$(awk -F'"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)
          if [ "v${cargo_version}" != "$TAG" ]; then
            echo "tag $TAG does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          pkg_version=$(node -p "require('./package.json').version")
          if [ "v${pkg_version}" != "$TAG" ]; then
            echo "tag $TAG does not match package.json version ${pkg_version}" >&2
            exit 1
          fi

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --locked --git https://github.com/cross-rs/cross

      - name: Install musl-tools (x86_64 linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/memory-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" memory

      - uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.target }}
          path: dist/memory-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: publish release and pin checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
            || gh release upload "$TAG" dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

      - name: Rewrite release.txt
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          out=skills/agent-memory/bin/release.txt
          {
            echo '# Format: "version <semver>" then one "sha256 <target> <hex>" line per target (sha256 of memory-<target>.tar.gz).'
            echo '# Rewritten by .github/workflows/release.yml on each release tag.'
            echo "version ${version}"
            for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
              hash=$(sha256sum "dist/memory-${target}.tar.gz" | awk '{ print $1 }')
              echo "sha256 ${target} ${hash}"
            done
          } > "$out"
          cat "$out"

      - name: Commit release.txt
        env:
          TAG: ${{ github.ref_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/agent-memory/bin/release.txt
          if git diff --cached --quiet; then
            echo "release.txt already up to date"
          else
            git commit -m "chore(release): pin ${TAG} checksums"
            git push origin "HEAD:${BRANCH}"
          fi

      - name: Move release branch to the pinned commit
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "HEAD does not contain tagged commit $GITHUB_SHA" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/release" --force
