name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - run: shellcheck skills/agent-memory/bin/memory tests/launcher.sh
      - run: bash tests/launcher.sh

  # The launcher runs under stock macOS /bin/sh and bash 3.2.
  launcher-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /bin/bash tests/launcher.sh

  test-opencode-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:opencode
